# ============================================================
#  Configuración Nginx para Lego ITlook
#  Reemplaza "itlook.midominio.co" por tu dominio y guarda.
# ============================================================

# Redirección de HTTP -> HTTPS y challenge de Let's Encrypt
server {
    listen 80;
    listen [::]:80;
    server_name itlook.midominio.co;

    # Ruta para el challenge HTTP-01 de Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás se redirige a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
#  Bloque HTTPS (se activa cuando exista el certificado)
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name itlook.midominio.co;

    ssl_certificate     /etc/letsencrypt/live/itlook.midominio.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itlook.midominio.co/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    location /static/ {
        proxy_pass http://web:5000/static/;
        proxy_set_header Host $host;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
